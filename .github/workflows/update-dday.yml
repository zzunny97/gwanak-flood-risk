name: Update D-Day

on:
  schedule:
    # 매일 KST 00:05 (UTC 15:05)
    - cron: "5 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_dday.py"
      - ".github/workflows/update-dday.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run D-day updater
        run: python .github/scripts/update_dday.py

      - name: Commit if changed
        run: |
          if [[ -n $(git status --porcelain README.md) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: D-day 자동 갱신"
            git push
          else
            echo "변경 사항 없음"
          fi
